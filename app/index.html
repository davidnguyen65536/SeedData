<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seed Data – crop rotation choices backed by NASA data</title>
  <meta name="description" content="Compare crop rotations for a paddock using NASA Earth observations and Australian data.">
  <meta name="theme-color" content="#1a2412">
  <!-- Start fetching the opening still and the scene straight away. -->
  <link rel="preload" as="image" href="landing/assets/poster-wide.webp" media="(min-aspect-ratio: 1/1)" fetchpriority="high">
  <link rel="preload" as="image" href="landing/assets/poster-tall.webp" media="(max-aspect-ratio: 1/1)" fetchpriority="high">
  <link rel="modulepreload" href="landing/build/main.js">
  <link rel="preload" as="image" href="landing/assets/terrain.jpg" crossorigin="anonymous">
  <link rel="preload" as="image" href="landing/assets/terrain-cls.png" crossorigin="anonymous">
  <link rel="preload" as="image" href="landing/assets/tex/corrugated_iron.jpg" crossorigin="anonymous">
  <link rel="preload" as="image" href="landing/assets/tex/eucalyptus_bark.jpg" crossorigin="anonymous">
  <link rel="preload" as="image" href="landing/assets/tex/white_planks_clean.jpg" crossorigin="anonymous">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2412; }
    /* The farm takes about three quarters of the screen; the paper panel holds the words. Tall screens stack them. */
    body { display: grid; grid-template-columns: minmax(0, 1fr) clamp(340px, 27vw, 480px); height: 100dvh; }
    .stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    #poster, #diorama { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #poster { object-fit: cover; }
    #diorama { opacity: 0; transition: opacity .6s ease; }
    #diorama.ready { opacity: 1; }
    /* No WebGL 2: a quiet field-coloured backdrop instead of a blank page. */
    .diorama-failed .stage { background: linear-gradient(160deg, #6b6a1f 0%, #3c5a23 38%, #1a2412 100%); }

    .panel { position: relative; z-index: 1; isolation: isolate; box-sizing: border-box; color: #1c1b17;
      display: flex; flex-direction: column; justify-content: center; padding: 8vh clamp(28px, 3vw, 52px) 14vh;
      font-family: "EB Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    /* torn paper edge facing the farm */
    .panel::before { content: ""; position: absolute; inset: -24px -24px -24px -12px; z-index: -1; background: #eceae2; filter: url(#torn); }
    .mark { width: 50px; height: auto; margin: 0 0 20px -9px; filter: url(#rough); overflow: visible; }
    .kicker { margin: 0 0 14px; display: flex; align-items: flex-end; gap: 10px; font-size: 1.2rem; font-weight: 500; }
    .kicker svg { width: 82px; height: 22px; flex: none; margin-bottom: -4px; }
    .panel h1 { margin: 0 0 18px; font-weight: 500; font-size: clamp(2.3rem, 3.3vw, 3.5rem); line-height: 1.02; letter-spacing: -.01em; text-wrap: balance; }
    .lede { margin: 0 0 32px; max-width: 26em; font-family: Poppins, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: .95rem; line-height: 1.6; color: #45453e; text-wrap: pretty; }

    /* One thing at a time, driven by the script below: the farm runs for a second, then the page adds
       .bloom and the seedling grows; when its last leaf has opened the page adds .arrow-on and the arrow draws. */
    .mark { opacity: 0; }
    .bloom .mark { opacity: 1; }
    .mark path, .mark ellipse { transform-box: fill-box; }
    .mark .seed { transform-origin: 50% 50%; } .mark .stem { transform-origin: 50% 100%; }
    .mark .leaf-l { transform-origin: 100% 100%; } .mark .leaf-r { transform-origin: 0% 100%; }
    .bloom .mark .seed { animation: pop .6s both cubic-bezier(.3, 1.3, .5, 1); }
    .bloom .mark .stem { animation: grow .8s .45s both cubic-bezier(.3, .8, .3, 1); }
    .bloom .mark .leaf-l { animation: unfurl .9s 1.1s both cubic-bezier(.3, 1.4, .4, 1); }
    .bloom .mark .leaf-r { animation: unfurl .9s 1.35s both cubic-bezier(.3, 1.4, .4, 1); }
    .kicker .draw { stroke-dasharray: 140; stroke-dashoffset: 140; }
    .arrow-on .kicker .draw { animation: draw .9s both ease-out; }
    @keyframes pop { from { transform: scale(0); } }
    @keyframes grow { from { transform: scaleY(0); } }
    @keyframes unfurl { from { transform: scale(0) rotate(-25deg); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .panel > :not(.mark) { animation: rise .8s .2s both cubic-bezier(.2, .7, .2, 1); }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

    /* The button keeps one size. At rest it says what you can do; on hover it shows what you get. */
    .ink { position: relative; isolation: isolate; color: #f7f6ef; }
    .ink::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #1c1b17; filter: url(#rough); transform: rotate(-.5deg); transition: background .35s; }
    .cta { align-self: flex-start; display: inline-grid; align-items: center; min-height: 50px; padding: 0 1.4em; clip-path: inset(-6px); text-decoration: none;
      font: 500 .95rem/1 Poppins, ui-sans-serif, system-ui, sans-serif; letter-spacing: .01em; transition: transform .2s; }
    .cta-track { grid-area: 1 / 1; display: grid; overflow: hidden; padding: .3em 0; }
    .cta-label { grid-area: 1 / 1; display: inline-flex; align-items: center; justify-content: center; gap: .6em; white-space: nowrap;
      transition: transform .45s cubic-bezier(.3, .8, .2, 1), opacity .35s; }
    .cta-label.win { transform: translateY(130%); opacity: 0; }
    .cta .arrow { width: 16px; height: 16px; flex: none; }
    .cta:is(:hover, :focus-visible, .win)::before { background: #2f6b3a; }
    .cta:is(:hover, :focus-visible, .win) .now { transform: translateY(-130%); opacity: 0; }
    .cta:is(:hover, :focus-visible, .win) .win { transform: none; opacity: 1; }
    .cta:active { transform: scale(.98); }
    .cta:focus-visible { outline: 2px solid #1c1b17; outline-offset: 5px; }
    .cta .splash { position: absolute; z-index: -1; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: rgba(247, 246, 239, .4); pointer-events: none; }

    /* Tall screens: farm on top, paper below with its torn edge facing up */
    @media (max-aspect-ratio: 1/1) {
      body { grid-template-columns: none; grid-template-rows: minmax(0, 1fr) auto; }
      .panel { justify-content: flex-start; padding: 24px 22px max(26px, env(safe-area-inset-bottom)); }
      .panel::before { inset: -12px -24px -24px -24px; }
      .mark { width: 38px; margin: 0 0 10px -7px; }
      .kicker { font-size: 1rem; }
      .kicker { margin-bottom: 8px; }
      .panel h1 { font-size: 2rem; margin-bottom: 12px; }
      .lede { margin-bottom: 20px; }
      .lede { font-size: .85rem; }
      .cta { min-height: 46px; }
    }

    /* Curtain: a green disc then the dashboard's paper colour grow out from the press.
       Scaled with transform, so the GPU animates it without repainting the page. */
    .curtain { position: fixed; z-index: 5; left: var(--x, 50vw); top: var(--y, 50vh); width: calc(var(--r, 150vmax) * 2); height: calc(var(--r, 150vmax) * 2);
      margin: calc(var(--r, 150vmax) * -1) 0 0 calc(var(--r, 150vmax) * -1); border-radius: 50%; pointer-events: none;
      transform: scale(0); visibility: hidden; will-change: transform; transition: transform .7s cubic-bezier(.65, 0, .3, 1), visibility 0s .7s; }
    .curtain.green { background: #2f6b3a; }
    .curtain.paper { background: #f5f2ea; }
    .leaving .curtain { transform: scale(1); visibility: visible; transition: transform .7s cubic-bezier(.65, 0, .3, 1); }
    .leaving .curtain.paper { transition-delay: .1s; }
    @media (prefers-reduced-motion: reduce) {
      .panel > *, .mark *, .kicker .draw { animation: none !important; }
      .mark { opacity: 1; } .kicker .draw { stroke-dashoffset: 0; }
      .cta-label, .curtain, .leaving .curtain { transition: none; }
    }
  </style>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=Poppins:wght@400;500&display=swap">
  <link rel="prefetch" href="dashboard.html">
</head>
<body>
  <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
    <!-- Ink edges for the labels and mark, and the torn edge of the paper panel -->
    <filter id="rough" x="-5%" y="-25%" width="110%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".04 .11" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="6"/>
    </filter>
    <filter id="torn" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="3" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="14"/>
    </filter>
  </svg>
  <!-- The landing diorama. Scene source: landing/main.js. The tool itself lives at dashboard.html. -->
  <!-- The opening frame as a still, shown instantly; the live scene fades in over it. Regenerate with __diorama.poster() (see landing/README.md). -->
  <div class="stage">
    <picture>
      <source media="(max-aspect-ratio: 1/1)" srcset="landing/assets/poster-tall.webp">
      <img id="poster" src="landing/assets/poster-wide.webp" alt="" fetchpriority="high" decoding="async">
    </picture>
    <canvas id="diorama" role="img" aria-label="An animated miniature of a farmstead among paddocks of wheat, canola, pasture and fallow, drawn in coloured text characters."></canvas>
  </div>
  <main class="panel">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="#1c1b17">
        <path class="stem" d="M49 92 C47 78 48 64 51 50 L54 50 C51 64 51 78 53 92 Z"/>
        <path class="leaf-l" d="M51 54 C40 54 24 48 18 30 C34 28 48 36 51 54 Z"/>
        <path class="leaf-r" d="M53 46 C56 30 68 16 86 14 C84 32 70 44 53 46 Z"/>
        <ellipse class="seed" cx="51" cy="93" rx="13" ry="5"/>
      </g>
    </svg>
    <p class="kicker">Ten years of NASA data <svg viewBox="0 0 82 22" aria-hidden="true"><path class="draw" d="M2 18 C22 21 44 17 74 9 M62 4 C67 6 72 8 76 9 C72 12 68 15 64 19" fill="none" stroke="#1c1b17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></p>
    <h1>Plant smarter next season.</h1>
    <p class="lede">Seed Data reads a decade of NASA rain, frost, heat and soil-moisture records for your paddock, then ranks crop rotations on water, soil, risk and income.</p>
    <a class="cta ink" id="cta" href="dashboard.html">
      <span class="cta-track">
        <span class="cta-label now">Plan your next season <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8h10.5M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="cta-label win" aria-hidden="true">Your best season yet</span>
      </span>
    </a>
  </main>
  <div class="curtain green" aria-hidden="true"></div>
  <div class="curtain paper" aria-hidden="true"></div>
  <script>
    // Pressing the button sends a ripple across it, then the curtain grows from that spot and the dashboard loads behind it.
    (() => {
      const cta = document.getElementById('cta'), root = document.documentElement;
      const calm = matchMedia('(prefers-reduced-motion: reduce)');
      cta.addEventListener('click', (e) => {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
        e.preventDefault();
        if (root.classList.contains('leaving')) return;
        const b = cta.getBoundingClientRect(), keyed = !e.clientX && !e.clientY;
        const x = keyed ? b.left + b.width / 2 : e.clientX, y = keyed ? b.top + b.height / 2 : e.clientY;
        const go = () => { location.href = cta.href; };
        if (calm.matches) return go();
        const ink = document.createElement('span'); ink.className = 'splash';
        ink.style.left = (x - b.left) + 'px'; ink.style.top = (y - b.top) + 'px'; cta.append(ink);
        ink.animate([{ transform: 'scale(0)', opacity: .9 }, { transform: `scale(${b.width / 5})`, opacity: 0 }], { duration: 550, easing: 'cubic-bezier(.2, .7, .2, 1)' }).onfinish = () => ink.remove();
        const r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 2;
        root.style.setProperty('--x', x + 'px'); root.style.setProperty('--y', y + 'px'); root.style.setProperty('--r', r + 'px');
        // Touch screens have no hover, so show the win first, then open the curtain.
        const hovered = cta.matches(':hover'); cta.classList.add('win');
        setTimeout(() => { root.classList.add('leaving'); setTimeout(go, 820); }, hovered ? 140 : 650);
      });
      // Sequence: once the live farm is on screen (its 0.6 s fade-in done) let it run for a second,
      // then bloom the seedling; the arrow starts the moment the last leaf finishes opening.
      // If the farm can't start (slow device, no WebGL), bloom after 6 s anyway.
      const canvas = document.getElementById('diorama');
      let bloomed = false;
      const arrow = () => root.classList.add('arrow-on');
      const bloom = () => { if (!bloomed) { bloomed = true; root.classList.add('bloom'); setTimeout(arrow, 2400); } }; // the timer only backs up the leaf's animationend
      const onReady = () => canvas.classList.contains('ready') && setTimeout(bloom, 600 + 1000);
      new MutationObserver(onReady).observe(canvas, { attributes: true, attributeFilter: ['class'] });
      setTimeout(bloom, 6000);
      document.querySelector('.mark .leaf-r').addEventListener('animationend', arrow);
      // Coming back with the browser's back button: open the page again.
      addEventListener('pageshow', (e) => { if (e.persisted) { root.classList.remove('leaving'); cta.classList.remove('win'); } });
    })();
  </script>
  <script type="module" src="landing/build/main.js"></script>
</body>
</html>
